<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Diet Planner Login</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to right,#1b4332,#2d6a4f);
            font-family:Arial;
        }

        .login-box{
            width:400px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(-20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-box h1{
            text-align:center;
            color:#1b4332;
            margin-bottom:30px;
        }

        .input-box{
            margin-top:20px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            background:#2d6a4f;
            color:white;
            font-size:16px;
            border-radius:10px;
            margin-top:25px;
            cursor:pointer;
        }

        button:hover{
            background:#1b4332;
        }

        .error{
            margin-top:15px;
            color:red;
            text-align:center;
        }

        .register{
            text-align:center;
            margin-top:20px;
        }

        .register a{
            color:#1b4332;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        <i class="fa-solid fa-heart-pulse"></i>
        Diet Planner
    </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

        </div>

        <div class="input-box">

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

        </div>

        <button type="submit">

            Login

        </button>

    </form>

    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}

    <div class="register">

        Don't have an account?

        <a href="{% url 'register' %}">

            Register

        </a>

    </div>

</div>

</body>
</html>
